name: plugin-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structural:
    name: structural + catalog sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Structural checks
        run: bash scripts/structural-check.sh
      - name: Agent frontmatter checks
        run: bash scripts/agent-check.sh

  portability:
    name: shellcheck portability sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Sweep shipped + dev scripts
        run: bash scripts/portability-check.sh

  sensor:
    name: hygiene sensor + self-test (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run sensor + scaffolder self-test
        run: bats tests/repo tests/marketplace-builder
